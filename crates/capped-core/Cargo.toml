[package]
name = "capped-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Retention/eviction core for the capped DuckDB storage extension: policy model, segment manifest, seal and eviction planning. Pure Rust, no DuckDB dependency."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
